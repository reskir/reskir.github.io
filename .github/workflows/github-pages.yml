name: Build and deploy Jekyll site to GitHub Pages

on:
    push:
        branches:
            - main

jobs:
    github-pages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Generate build status data
              run: |
                  cat > _data/github-status.json << EOF
                  {
                    "status": "built",
                    "created_at": "${{ github.event.head_commit.timestamp }}",
                    "pusher": {
                      "login": "${{ github.actor }}",
                      "html_url": "https://github.com/${{ github.actor }}",
                      "avatar_url": "https://github.com/${{ github.actor }}.png"
                    }
                  }
                  EOF
            - uses: helaili/jekyll-action@v2
              with:
                  token: ${{ secrets.GIT_TOKEN }}
                  pre_build_commands: apk --update add imagemagick
